<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Welcome to Codex Main.">
    <title>Hello World · Codex Main</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(ellipse at top, #203345, #0c121a 65%);
        color: #f3f7fc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(100%, 720px); text-align: center; }
      .label {
        display: inline-block;
        padding: 8px 14px;
        border: 1px solid #395266;
        border-radius: 999px;
        color: #a9e7d4;
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 28px 0 16px;
        font-size: clamp(3.5rem, 12vw, 7rem);
        line-height: 1.05;
        letter-spacing: -0.065em;
      }
      h1 span { color: #8fe6c8; }
      p { margin: 0; color: #b8c7d7; font-size: 1.15rem; line-height: 1.7; }
      footer { margin-top: 64px; color: #96a9bd; font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="label">Codex Main</div>
      <h1>Hello World<span>.</span></h1>
      <p>Welcome to your workspace.<br>Great things start with a simple hello.</p>
      <footer>Build. Learn. Explore.</footer>
    </main>
  </body>
</html>
