<text x="66" y="133" class="eyebrow">01 / LEARNING HUB</text><text x="66" y="190" class="heading">Start with a question.</text><text x="66" y="225" class="sub">Learn the concepts, explore a use case, and build with confidence.</text><rect x="66" y="269" width="849" height="266" rx="10" fill="#e6efe7"/><text x="99" y="313" class="eyebrow">SUGGESTED FIRST JOURNEY · 15 MIN READ</text><text x="99" y="359" font-size="29" font-weight="bold">Why do customers leave?</text><text x="99" y="394" class="sub">Follow a synthetic example from a business question</text><text x="99" y="421" class="sub">to a first machine-learning experiment.</text><rect x="99" y="455" width="193" height="46" rx="6" fill="#285f50"/><text x="122" y="484" class="button">Explore the example →</text><circle cx="789" cy="399" r="62" fill="none" stroke="#a9c1ad"/><circle cx="789" cy="399" r="36" fill="#c9decd"/><path d="M765 406l18-19 13 12 19-22" fill="none" stroke="#37725e" stroke-width="3"/><circle cx="765" cy="406" r="4" fill="#37725e"/><circle cx="815" cy="377" r="4" fill="#37725e"/>
<rect x="940" y="269" width="373" height="266" rx="10" fill="#fff" class="border"/><text x="968" y="313" class="eyebrow">YOUR PATH</text><text x="968" y="351" class="h3">Learn at your own pace</text><text x="968" y="388" class="body">①  Understand the problem</text><text x="968" y="423" class="body">②  Explore data and features</text><text x="968" y="458" class="body">③  Evaluate and reflect</text><text x="968" y="501" class="tiny">Already experienced? Start a project directly →</text>
<text x="66" y="603" class="h2">Explore other questions</text><text x="66" y="632" class="body">Choose what is relevant to you.</text><rect x="66" y="662" width="401" height="173" rx="8" fill="#fff" class="border"/><text x="91" y="699" class="eyebrow">CLASSIFICATION</text><text x="91" y="737" class="h3">Will a lead convert?</text><text x="91" y="770" class="body">Explore a sales qualification problem.</text><text x="91" y="808" class="body">Explore guide →</text><rect x="489" y="662" width="402" height="173" rx="8" fill="#fff" class="border"/><text x="514" y="699" class="eyebrow">REGRESSION</text><text x="514" y="737" class="h3">Estimate future sales</text><text x="514" y="770" class="body">Learn to predict a numeric outcome.</text><text x="514" y="808" class="body">Explore guide →</text><rect x="913" y="662" width="400" height="173" rx="8" fill="#fff" class="border"/><text x="938" y="699" class="eyebrow">START YOUR WAY</text><text x="938" y="737" class="h3">Bring your own question</text><text x="938" y="770" class="body">Set up a project with your own goal.</text><text x="938" y="808" class="body">Create project →</text></g>
<!-- Churn introduction -->
<g transform="translate(1480 20)"><rect width="1380" height="910" rx="12" fill="#f8faf7"/><rect width="1380" height="76" rx="12" fill="#fff"/><text x="45" y="47" class="brand">codex<tspan fill="#4a816d">.</tspan>main</text><text x="355" y="47" class="nav">Learn</text><text x="458" y="47" class="nav">My projects</text><text x="604" y="47" class="nav">Use cases</text><text x="1274" y="47" class="nav">Account</text>
<text x="66" y="123" class="body">← Learning hub  /  Customer churn</text><text x="66" y="174" class="eyebrow">02 / CUSTOMER CHURN · LEARN</text><text x="66" y="229" class="heading">Understand the question.</text><text x="66" y="268" class="sub">A first look at predicting which customers may leave a service.</text>
<rect x="66" y="310" width="248" height="505" rx="8" fill="#eef3ee"/>
<text x="87" y="348" class="eyebrow">YOUR LEARNING PATH</text>
<text x="87" y="372" font-size="13" fill="#53646c">Step 1 of 5 · The problem</text>
<path d="M105 420v222" stroke="#d3e1d6" stroke-width="2"/>
<rect x="78" y="390" width="224" height="62" rx="7" fill="#d5e6da"/>
<circle cx="105" cy="421" r="13" fill="#285f50"/><text x="105" y="426" text-anchor="middle" font-size="13" font-weight="bold" style="fill:white">1</text><text x="130" y="417" font-size="14" font-weight="bold">The problem</text><text x="130" y="436" font-size="11" fill="#38695d">CURRENT STEP</text>
<circle cx="105" cy="483" r="13" fill="#f8faf7" stroke="#b8cabe"/><text x="105" y="488" text-anchor="middle" font-size="13" fill="#53646c">2</text><text x="130" y="488" font-size="14">Explore the data</text>
<circle cx="105" cy="536" r="13" fill="#f8faf7" stroke="#b8cabe"/><text x="105" y="541" text-anchor="middle" font-size="13" fill="#53646c">3</text><text x="130" y="541" font-size="14">Choose features</text>
<circle cx="105" cy="589" r="13" fill="#f8faf7" stroke="#b8cabe"/><text x="105" y="594" text-anchor="middle" font-size="13" fill="#53646c">4</text><text x="130" y="594" font-size="14">Compare a baseline</text>
<circle cx="105" cy="642" r="13" fill="#f8faf7" stroke="#b8cabe"/><text x="105" y="647" text-anchor="middle" font-size="13" fill="#53646c">5</text><text x="130" y="647" font-size="14">Reflect on results</text>
<path d="M87 688h205" stroke="#cfddd2"/><text x="87" y="720" font-size="12" fill="#53646c">Learn with a sample scenario</text><text x="87" y="742" font-size="12" fill="#53646c">No data upload needed</text>
<text x="354" y="350" class="eyebrow">THE BUSINESS QUESTION</text><text x="354" y="394" style="font-family:Georgia,serif;fill:#182f2a" font-size="25" font-weight="600">Which customers might leave?</text><text x="354" y="432" class="body">Imagine a subscription service wants to understand which active</text><text x="354" y="458" class="body">customers may cancel within the next 30 days.</text><text x="354" y="509" style="font-family:Georgia,serif;fill:#182f2a" font-size="22" font-weight="600">What could a prediction help with?</text><text x="354" y="543" class="body">A team could use it to investigate the reasons customers leave and</text><text x="354" y="569" class="body">consider support options. <tspan font-weight="bold" fill="#214c3e">A prediction alone does not explain why.</tspan></text><rect x="354" y="606" width="577" height="105" rx="7" fill="#e5eee7"/><text x="376" y="640" class="h3">Key idea: prediction time</text><text x="376" y="671" class="body">Use information available before cancellation to avoid leakage.</text><rect x="354" y="750" width="202" height="46" rx="6" fill="#285f50"/><text x="377" y="779" class="button">Explore sample data →</text>
<rect x="974" y="310" width="339" height="505" rx="8" fill="#fff" class="border"/><text x="999" y="352" class="eyebrow">LEARNING COMPANION</text><text x="999" y="390" class="h3">Need a little context?</text><text x="999" y="424" class="body">Ask for a plain-language</text><text x="999" y="448" class="body">explanation as you learn.</text><rect x="999" y="484" width="289" height="56" rx="6" fill="#f4f7f4" class="border"/><text x="1015" y="518" class="body">What is a prediction target?</text><rect x="999" y="553" width="289" height="56" rx="6" fill="#f4f7f4" class="border"/><text x="1015" y="587" class="body">Why use a 30-day window?</text><text x="999" y="673" class="tiny">AI suggestions can be wrong; review them.</text><text x="999" y="696" class="tiny">No private data is needed here.</text></g>
</svg>
