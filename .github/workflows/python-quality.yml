name: Python quality

on:
  push:
    branches: [main, dev, sit, uat]
  pull_request:
    branches: [main, dev, sit, uat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Python / ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [pylint, ruff, bandit, notebooks, tests]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install CI and application dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements-ci.txt
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f pyproject.toml ] && python -c 'import tomllib; d=tomllib.load(open("pyproject.toml", "rb")); raise SystemExit(0 if "build-system" in d else 1)'; then
            python -m pip install .
          fi
          python -m pip check
      - name: Run ${{ matrix.check }}
        run: python .github/scripts/python_checks.py '${{ matrix.check }}'
