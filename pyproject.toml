[project]
name = "codex-main"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pyjwt[crypto]>=2.10,<3",
  "python-multipart>=0.0.22,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
worker = [
  "huggingface-hub>=0.34,<2",
  "langchain-huggingface>=1,<2",
  "langchain-text-splitters>=1,<2",
  "pandas>=2.2,<4",
  "pypdf>=6,<7",
  "scikit-learn>=1.7,<2",
  "sentence-transformers>=5,<6",
  "torch>=2.8,<3",
]
ai = ["langchain-openrouter>=0.1,<1"]
test = ["pytest>=8,<10"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
